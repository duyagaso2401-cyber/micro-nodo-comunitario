<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nodo Comunitario | Catálogo Local</title>
  <meta name="description" content="Repositorio educativo y de servicios digitales, disponible sin conexión a internet." />
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="min-h-screen bg-slate-50 pb-24 text-slate-900 antialiased">

  <!-- Encabezado -->
  <header class="sticky top-0 z-20 bg-nodo-700 px-4 pb-4 pt-5 text-white shadow-md">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-xs uppercase tracking-wide text-nodo-100">Punto Comunitario</p>
        <h1 id="nombre-nodo" class="text-lg font-bold leading-tight">Cargando nodo…</h1>
      </div>
      <span id="indicador-estado" class="flex items-center gap-1.5 rounded-full bg-white/10 px-2.5 py-1 text-xs font-medium">
        <span class="h-2 w-2 rounded-full bg-nodo-100"></span>
        En línea
      </span>
    </div>

    <!-- Buscador -->
    <div class="mt-4 flex items-center gap-2 rounded-xl bg-white/95 px-3 py-2 shadow-inner">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        id="campo-busqueda"
        type="search"
        placeholder="Buscar guías, libros, manuales…"
        class="w-full bg-transparent text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none"
      />
    </div>
  </header>

  <!-- Categorías -->
  <nav id="lista-categorias" class="scrollbar-none flex gap-2 overflow-x-auto px-4 py-4">
    <button data-slug="" class="pill-categoria pill-categoria-activa" data-pill>Todo</button>
  </nav>

  <!-- Estado del nodo (almacenamiento / catálogo) -->
  <div id="resumen-nodo" class="mx-4 mb-4 hidden rounded-xl bg-white px-4 py-3 text-xs text-slate-500 shadow-sm ring-1 ring-slate-100"></div>

  <!-- Catálogo -->
  <main class="px-4">
    <div id="mensaje-vacio" class="hidden rounded-2xl bg-white p-8 text-center text-slate-400 shadow-sm">
      No se encontraron contenidos con ese filtro.
    </div>
    <div id="grilla-contenidos" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Toast de mensajes -->
  <div id="toast" class="pointer-events-none fixed inset-x-4 bottom-6 z-30 translate-y-4 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white opacity-0 shadow-lg transition-all duration-300"></div>

  <!-- Modal de validación de PIN -->
  <div id="modal-pin" class="fixed inset-0 z-40 hidden items-end justify-center bg-black/40 sm:items-center">
    <div class="w-full max-w-sm rounded-t-2xl bg-white p-5 sm:rounded-2xl">
      <div class="mb-3 flex items-start justify-between">
        <div>
          <p class="insignia-premium mb-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="10" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Contenido premium
          </p>
          <h2 class="text-base font-semibold" id="modal-titulo-contenido">Título del contenido</h2>
        </div>
        <button id="modal-cerrar" class="rounded-full p-1 text-slate-400 active:bg-slate-100" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <p class="mb-3 text-sm text-slate-500">
        Ingresa el PIN de acceso. Puedes comprarlo en el mostrador o generarlo escaneando el QR de pago.
      </p>

      <input
        id="modal-input-pin"
        type="text"
        inputmode="text"
        maxlength="8"
        placeholder="Ej. K7X9PQ"
        class="mb-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-center text-lg font-semibold uppercase tracking-[0.3em] focus:border-nodo-500 focus:outline-none"
      />
      <p id="modal-error" class="mb-3 hidden text-center text-sm font-medium text-rose-600"></p>

      <button id="modal-validar" class="boton-primario mb-2">Validar y descargar</button>
      <button id="modal-cancelar" class="boton-secundario">Cancelar</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
